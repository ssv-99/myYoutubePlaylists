name: Update learning resources

on:
  schedule:
    - cron: "30 3 * * *"        # daily, 03:30 UTC (GitHub may delay it a little)
  workflow_dispatch:             # "Run workflow" button in the Actions tab
    inputs:
      max_new:
        description: "Safety cap on new videos added in one run"
        default: "50"
  push:
    paths:
      - "data/**"                # hand-edit a category on GitHub -> markdown regenerates

permissions:
  contents: write                # lets the job commit the regenerated files

concurrency:
  group: update-learning-resources
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync playlist and regenerate markdown
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PLAYLIST_ID: ${{ vars.PLAYLIST_ID }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_NEW: ${{ inputs.max_new || '50' }}
        run: python scripts/sync.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data Learning-Resources-Original.md Learning-Resources-n-Playlists-Categorized.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Update learning resources from playlist"
            git push
          fi
